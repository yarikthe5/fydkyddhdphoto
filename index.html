<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Batch Gallery FIX</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Cormorant+Garamond:wght@400;600&family=Comfortaa:wght@300;400;700&family=Playfair+Display:wght@400;600;700&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Arial;background:#f5f5f5;padding:15px}

.block{background:#fff;padding:10px;border-radius:10px;margin-bottom:10px}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:12px;
}

.card{
background:#fff;
padding:8px;
border-radius:10px;
}

img{width:100%;border-radius:10px}

.small{font-size:12px;color:#666}

input,textarea,select,button{width:100%;padding:10px;margin-top:5px}
</style>
</head>

<body>

<div class="block">
<h3>📁 Фото</h3>
<input type="file" id="files" webkitdirectory multiple>
</div>

<div class="block">
<h3>✍️ Тексти (///)</h3>
<textarea id="texts">Ти можеш///Продовжуй///Не здавайся</textarea>
</div>

<div class="block">
<h3>🇺🇦 Шрифт</h3>
<select id="font">
<option value="Unbounded">Unbounded</option>
<option value="Playfair Display">Playfair Display</option>
<option value="Cormorant Garamond">Cormorant</option>
<option value="Comfortaa">Comfortaa</option>
<option value="Bad Script">Bad Script</option>
</select>
</div>

<div class="block">
<h3>🧊 Pixel</h3>
<input type="range" id="pixel" min="1" max="20" value="1">
</div>

<div class="block">
<h3>💧 Watermark</h3>
<input id="wm" placeholder="@brand">
</div>

<button onclick="generate()">🚀 Generate</button>

<div id="gallery"></div>

<script>

let files=[];

document.getElementById("files").addEventListener("change",e=>{
    files=[...e.target.files];
});

function pixelate(canvas,ctx,factor){
    const w=canvas.width,h=canvas.height;

    let small=document.createElement("canvas");
    small.width=Math.max(1,Math.floor(w/factor));
    small.height=Math.max(1,Math.floor(h/factor));

    let sctx=small.getContext("2d");

    sctx.imageSmoothingEnabled=false;
    sctx.drawImage(canvas,0,0,small.width,small.height);

    ctx.clearRect(0,0,w,h);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(small,0,0,small.width,small.height,0,0,w,h);
}

function renderBase(file,text,font,wm){

    return new Promise(res=>{

        let img=new Image();
        img.src=URL.createObjectURL(file);

        img.onload=()=>{

            let c=document.createElement("canvas");
            c.width=1080;
            c.height=1080;
            let ctx=c.getContext("2d");

            ctx.fillStyle="#fff";
            ctx.fillRect(0,0,1080,1080);

            ctx.fillStyle="#000";
            ctx.font=`70px "${font}"`;
            ctx.textAlign="center";

            let y=150;

            text.split(" ").forEach(t=>{
                ctx.fillText(t,540,y);
                y+=80;
            });

            ctx.drawImage(img,0,300,1080,780);

            if(wm){
                ctx.fillStyle="rgba(0,0,0,0.6)";
                ctx.font="40px Arial";
                ctx.fillText(wm,540,1040);
            }

            res(c); // 🔥 чистий canvas
        };
    });
}

function makePixelCopy(base,pixel){

    let c2=document.createElement("canvas");
    c2.width=1080;
    c2.height=1080;

    let ctx2=c2.getContext("2d");

    ctx2.drawImage(base,0,0);

    if(pixel>1){
        pixelate(c2,ctx2,pixel);
    }

    return c2;
}

async function generate(){

    let texts=document.getElementById("texts").value.split("///");
    let font=document.getElementById("font").value;
    let pixel=parseInt(document.getElementById("pixel").value);
    let wm=document.getElementById("wm").value;

    let gallery=document.getElementById("gallery");
    gallery.innerHTML="";

    for(let i=0;i<files.length;i++){

        let base=await renderBase(files[i],texts[i]||"",font,wm);

        let normal=base.toDataURL("image/jpeg",0.95);
        let pix=makePixelCopy(base,pixel).toDataURL("image/jpeg",0.95);

        let row=document.createElement("div");
        row.className="row";

        row.innerHTML=`
            <div class="card">
                <div class="small">${i+1}pic</div>
                <img src="${normal}">
            </div>

            <div class="card">
                <div class="small">${i+1}pix</div>
                <img src="${pix}">
            </div>
        `;

        gallery.appendChild(row);
    }
}

</script>

</body>
</html>
