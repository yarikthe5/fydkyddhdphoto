<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Batch Motivation FIX+</title>

<link href="https://fonts.googleapis.com/css2?family=Bad+Script&family=Cormorant+Garamond:wght@400;600&family=Comfortaa:wght@300;400;700&family=Playfair+Display:wght@400;600;700&family=Unbounded:wght@300;500;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.block{background:#fff;padding:10px;margin-bottom:10px;border-radius:10px}
input,textarea,select,button{width:100%;padding:10px;margin-top:5px}
button{background:black;color:white;border:0;border-radius:10px}
canvas{width:100%;margin-top:5px}
.small{font-size:12px;color:#666}
</style>
</head>

<body>

<div class="block">
<h3>📁 Фото</h3>
<input type="file" id="files" webkitdirectory multiple>
</div>

<div class="block">
<h3>✍️ Тексти (///)</h3>
<textarea id="texts">Ти сильний///Продовжуй///Не здавайся</textarea>
</div>

<div class="block">
<h3>🇺🇦 Мотиваційні шрифти</h3>
<select id="font">
    <option value="Unbounded">Unbounded</option>
    <option value="Playfair Display">Playfair Display</option>
    <option value="Cormorant Garamond">Cormorant Garamond</option>
    <option value="Comfortaa">Comfortaa</option>
    <option value="Bad Script">Bad Script</option>
</select>
</div>

<div class="block">
<h3>📏 Розмір</h3>
<input id="size" value="70">
</div>

<div class="block">
<h3>💧 Watermark</h3>
<input id="wm" placeholder="@brand">
</div>

<div class="block">
<h3>🧊 Pixel</h3>
<input type="range" id="pixel" min="1" max="20" value="1">
</div>

<div class="block">
<h3>👀 Preview</h3>
<canvas id="p1" width="540" height="540"></canvas>
<canvas id="p2" width="540" height="540"></canvas>
<canvas id="p3" width="540" height="540"></canvas>
</div>

<button onclick="start()">🚀 EXPORT ZIP</button>

<script>

let files=[];

document.getElementById("files").addEventListener("change",e=>{
    files=[...e.target.files];
    renderPreview();
});

function fontStyle(type,size){
    return `${size}px "${type}", serif`;
}

function wrap(ctx,text,w){
    let words=text.split(" ");
    let lines=[""];
    for(let w2 of words){
        let t=lines[lines.length-1]+" "+w2;
        if(ctx.measureText(t).width>w){
            lines.push(w2);
        }else lines[lines.length-1]=t;
    }
    return lines;
}

function pixelate(canvas, ctx, factor){
    const w=canvas.width,h=canvas.height;

    let temp=document.createElement("canvas");
    temp.width=Math.max(1,Math.floor(w/factor));
    temp.height=Math.max(1,Math.floor(h/factor));

    let tctx=temp.getContext("2d");
    tctx.imageSmoothingEnabled=false;
    tctx.drawImage(canvas,0,0,temp.width,temp.height);

    ctx.clearRect(0,0,w,h);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(temp,0,0,temp.width,temp.height,0,0,w,h);
}

function draw(canvas,text,fontType){
    let ctx=canvas.getContext("2d");

    ctx.fillStyle="#fff";
    ctx.fillRect(0,0,540,540);

    let size=parseInt(document.getElementById("size").value);

    ctx.font=fontStyle(fontType,size);
    ctx.textAlign="center";

    let lines=wrap(ctx,text,460);

    let y=220;

    ctx.fillStyle="#000";
    ctx.strokeStyle="rgba(0,0,0,0.7)";
    ctx.lineWidth=5;

    lines.forEach(l=>{
        ctx.strokeText(l,270,y);
        ctx.fillText(l,270,y);
        y+=size+12;
    });

    let px=parseInt(document.getElementById("pixel").value);
    if(px>1) pixelate(canvas,ctx,px);

    ctx.fillStyle="rgba(0,0,0,0.4)";
    ctx.font="12px Arial";
    ctx.fillText("PREVIEW",270,520);
}

function renderPreview(){
    let t=document.getElementById("texts").value.split("///");

    draw(p1,t[0]||"",font.value);
    draw(p2,t[1]||"",font.value);
    draw(p3,t[2]||"",font.value);
}

["texts","font","size","pixel"].forEach(id=>{
    document.getElementById(id).addEventListener("input",renderPreview);
});

async function renderBase(file,text){
    return new Promise(res=>{
        let img=new Image();
        img.src=URL.createObjectURL(file);

        img.onload=()=>{
            let c=document.createElement("canvas");
            c.width=1080;c.height=1080;
            let ctx=c.getContext("2d");

            ctx.fillStyle="#fff";
            ctx.fillRect(0,0,1080,1080);

            let size=parseInt(document.getElementById("size").value);

            ctx.font=fontStyle(document.getElementById("font").value,size);
            ctx.textAlign="center";

            let lines=wrap(ctx,text,900);
            let y=200;

            ctx.fillStyle="#000";
            ctx.strokeStyle="black";
            ctx.lineWidth=6;

            lines.forEach(l=>{
                ctx.strokeText(l,540,y);
                ctx.fillText(l,540,y);
                y+=size+15;
            });

            ctx.drawImage(img,0,y,1080,1080-y);

            let wm=document.getElementById("wm").value;
            if(wm){
                ctx.fillStyle="rgba(0,0,0,0.6)";
                ctx.font="40px Arial";
                ctx.fillText(wm,540,1040);
            }

            res(c);
        };
    });
}

function makePixel(base,pixel){
    let c2=document.createElement("canvas");
    c2.width=1080;c2.height=1080;
    let ctx2=c2.getContext("2d");

    ctx2.drawImage(base,0,0);

    if(pixel>1){
        pixelate(c2,ctx2,pixel);
    }

    return c2;
}

async function start(){
    let texts=document.getElementById("texts").value.split("///");
    let pixel=parseInt(document.getElementById("pixel").value);

    let zip=new JSZip();
    let bar=0;

    for(let i=0;i<files.length;i++){

        let base=await renderBase(files[i],texts[i]||"");

        let normal=base.toDataURL("image/jpeg",0.95);
        zip.file(`${i+1}pic.jpg`,normal.split(",")[1],{base64:true});

        let pixCanvas=makePixel(base,pixel);
        let pix=pixCanvas.toDataURL("image/jpeg",0.95);
        zip.file(`${i+1}pix.jpg`,pix.split(",")[1],{base64:true});
    }

    let out=await zip.generateAsync({type:"blob"});

    let a=document.createElement("a");
    a.href=URL.createObjectURL(out);
    a.download="batch.zip";
    a.click();
}

renderPreview();

</script>

</body>
</html>
