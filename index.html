<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<title>Batch FIXED</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0;padding:20px}
.block{background:#fff;padding:10px;margin-bottom:10px;border-radius:10px}
input,textarea{width:100%;padding:10px;margin-top:5px}
button{width:100%;padding:12px;background:black;color:white;border:0;border-radius:10px}
</style>
</head>

<body>

<div class="block">
<h3>📁 Фото</h3>
<input type="file" id="files" webkitdirectory multiple>
</div>

<div class="block">
<h3>✍️ Тексти (///)</h3>
<textarea id="texts">Текст 1///Текст 2///Текст 3</textarea>
</div>

<div class="block">
<h3>💧 Watermark</h3>
<input id="wm" placeholder="@brand">
</div>

<div class="block">
<h3>🧊 Pixel</h3>
<input type="range" id="pixel" min="1" max="20" value="1">
</div>

<button onclick="start()">🚀 EXPORT ZIP</button>

<script>

let files=[];

document.getElementById("files").addEventListener("change",e=>{
    files=[...e.target.files];
});

function pixelate(canvas, ctx, factor){
    const w=canvas.width,h=canvas.height;

    let temp=document.createElement("canvas");
    temp.width=Math.max(1,Math.floor(w/factor));
    temp.height=Math.max(1,Math.floor(h/factor));

    let tctx=temp.getContext("2d");

    tctx.imageSmoothingEnabled=false;
    tctx.drawImage(canvas,0,0,temp.width,temp.height);

    ctx.clearRect(0,0,w,h);
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(temp,0,0,temp.width,temp.height,0,0,w,h);
}

// 🔥 main render (NO pixel)
function renderBase(file,text,wm){
    return new Promise(res=>{
        let img=new Image();
        img.src=URL.createObjectURL(file);

        img.onload=()=>{

            let c=document.createElement("canvas");
            c.width=1080;
            c.height=1080;
            let ctx=c.getContext("2d");

            // bg
            ctx.fillStyle="#fff";
            ctx.fillRect(0,0,1080,1080);

            // text
            ctx.fillStyle="#000";
            ctx.font="60px Arial";
            ctx.textAlign="center";

            let y=120;
            let words=text.split(" ");

            words.forEach(w=>{
                ctx.fillText(w,540,y);
                y+=70;
            });

            // image
            ctx.drawImage(img,0,300,1080,780);

            // watermark
            if(wm){
                ctx.fillStyle="rgba(0,0,0,0.6)";
                ctx.font="40px Arial";
                ctx.fillText(wm,540,1040);
            }

            res(c);
        };
    });
}

// 🔥 pixel version (COPY + PIXEL)
function makePixel(canvas,pixel){
    let c2=document.createElement("canvas");
    c2.width=1080;
    c2.height=1080;
    let ctx2=c2.getContext("2d");

    ctx2.drawImage(canvas,0,0);

    if(pixel>1){
        pixelate(c2,ctx2,pixel);
    }

    return c2;
}

async function start(){

    let texts=document.getElementById("texts").value.split("///");
    let wm=document.getElementById("wm").value;
    let pixel=parseInt(document.getElementById("pixel").value);

    let zip=new JSZip();

    for(let i=0;i<files.length;i++){

        let base=await renderBase(files[i],texts[i]||"",wm);

        // NORMAL
        let normal=base.toDataURL("image/jpeg",0.95);
        zip.file(`${i+1}pic.jpg`,normal.split(",")[1],{base64:true});

        // PIXEL
        let pixCanvas=makePixel(base,pixel);
        let pix=pixCanvas.toDataURL("image/jpeg",0.95);
        zip.file(`${i+1}pix.jpg`,pix.split(",")[1],{base64:true});
    }

    let out=await zip.generateAsync({type:"blob"});

    let a=document.createElement("a");
    a.href=URL.createObjectURL(out);
    a.download="batch.zip";
    a.click();
}

</script>

</body>
</html>
