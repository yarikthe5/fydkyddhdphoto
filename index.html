<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Batch Image Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#f5f5f5;
}

.wrap{
    max-width:600px;
    margin:auto;
    padding:12px;
}

.block{
    background:white;
    padding:12px;
    border-radius:12px;
    margin-bottom:10px;
}

textarea, input{
    width:100%;
    padding:12px;
    font-size:14px;
    margin-top:8px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:black;
    color:white;
    margin-top:10px;
}

img{
    width:100%;
    border-radius:10px;
    margin-top:10px;
}

#progress{
    height:10px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

#bar{
    height:100%;
    width:0%;
    background:green;
}
</style>
</head>

<body>

<div class="wrap">

<div class="block">
<h3>Фото папка</h3>
<input type="file" id="files" webkitdirectory multiple>
</div>

<div class="block">
<h3>Тексти (через ///)</h3>
<textarea id="texts" rows="6"></textarea>
</div>

<div class="block">
<button onclick="start()">Створити ZIP</button>
</div>

<div class="block">
<div id="progress"><div id="bar"></div></div>
</div>

</div>

<script>

let files = [];

document.getElementById("files").addEventListener("change", e=>{
    files = Array.from(e.target.files);
});

function wrapText(ctx,text,maxWidth,maxLines){
    let words = text.split(" ");
    let lines=[""];

    for(let w of words){
        let test = lines[lines.length-1] + " " + w;
        if(ctx.measureText(test).width > maxWidth){
            if(lines.length < maxLines){
                lines.push(w);
            }
        } else {
            lines[lines.length-1]=test;
        }
    }
    return lines.slice(0,maxLines);
}

function fitFont(ctx,text){
    let size = 120;
    while(size>20){
        ctx.font = `bold ${size}px Arial`;
        if(ctx.measureText(text).width < 900) return size;
        size--;
    }
    return 20;
}

async function renderImage(file,text,idx){
    return new Promise(res=>{

        const img = new Image();
        const url = URL.createObjectURL(file);

        img.onload = ()=>{

            const c = document.createElement("canvas");
            c.width=1080;
            c.height=1080;
            const ctx=c.getContext("2d");

            ctx.fillStyle="white";
            ctx.fillRect(0,0,1080,1080);

            let fontSize = fitFont(ctx,text);
            ctx.font = `bold ${fontSize}px Arial`;
            ctx.fillStyle="black";
            ctx.textAlign="center";

            let lines = wrapText(ctx,text,900,2);

            let y=120;
            let lineH = fontSize+10;

            let topH = lines.length * lineH + 80;

            lines.forEach(l=>{
                ctx.fillText(l,540,y);
                y+=lineH;
            });

            ctx.drawImage(img,0,topH,1080,1080-topH);

            const normal = c.toDataURL("image/jpeg",0.95);

            // BLUR VERSION
            const c2 = document.createElement("canvas");
            c2.width=1080;
            c2.height=1080;
            const cx = c2.getContext("2d");

            cx.filter="blur(10px)";
            cx.drawImage(c,0,0);

            const blur = c2.toDataURL("image/jpeg",0.95);

            res({normal,blur,idx});
        };

        img.src=url;
    });
}

async function start(){

    const texts = document.getElementById("texts").value
        .split("///")
        .map(t=>t.trim())
        .filter(t=>t);

    const zip = new JSZip();

    let bar = document.getElementById("bar");

    for(let i=0;i<files.length;i++){

        let t = texts[i] || "";

        let r = await renderImage(files[i],t,i+1);

        let n = r.normal.split(",")[1];
        let b = r.blur.split(",")[1];

        zip.file(`${i+1}.jpg`, n, {base64:true});
        zip.file(`${i+1}pix.jpg`, b, {base64:true});

        bar.style.width = ((i+1)/files.length*100)+"%";
    }

    const content = await zip.generateAsync({type:"blob"});

    const a = document.createElement("a");
    a.href = URL.createObjectURL(content);
    a.download = "images.zip";
    a.click();
}

</script>

</body>
</html>
